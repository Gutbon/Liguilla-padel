  line.textContent = `[${time}] ${msg}`;

}
window.addEventListener('error', e => __log('Error de script: '+(e.message||e), true));
window.addEventListener('unhandledrejection', e => __log('Promesa rechazada: '+(e.reason&&e.reason.message?e.reason.message:e.reason), true));

};
// ⚠️ Cambia este PIN antes de publicar.
const ADMIN_PIN = "PADEL2026";

__log('Imports de Firebase OK, inicializando con projectId="'+firebaseConfig.projectId+'"…');
const app = initializeApp(firebaseConfig);
const dbase = getFirestore(app);
const auth = getAuth(app);
__log('Firebase inicializado. Iniciando sesión anónima…');

let myId=localStorage.getItem('padel_myid'), isAdmin=false;
let players={}, teams={}, matches={}, leagues={};
let selectedLeagueId={liga:localStorage.getItem('padel_sel_liga')||null, torneo:localStorage.getItem('padel_sel_torneo')||null};

let loaded={players:false,teams:false,matches:false,leagues:false};
let lastError=null;

function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function showError(ctx,err){ console.error(ctx,err); lastError=ctx+': '+(err&&err.message?err.message:String(err)); render(); }

signInAnonymously(auth).then(()=>__log('✅ Sesión anónima iniciada')).catch(err=>{ __log('❌ Falló el login anónimo: '+err.message+' (código: '+err.code+')', true); showError('No se pudo conectar',err); });
onAuthStateChanged(auth, async u=>{
  __log(u ? '✅ onAuthStateChanged: hay usuario autenticado' : '⚠️ onAuthStateChanged: sin usuario');
  if(!u) return;
  onSnapshot(collection(dbase,"players"), snap=>{ players={}; snap.docs.forEach(d=>players[d.id]=d.data()); loaded.players=true; __log('✅ players cargado ('+snap.docs.length+' docs)'); render(); }, err=>{ __log('❌ Error leyendo players: '+err.message,true); showError('Error leyendo jugadores',err); });
  onSnapshot(collection(dbase,"teams"), snap=>{ teams={}; snap.docs.forEach(d=>teams[d.id]=d.data()); loaded.teams=true; __log('✅ teams cargado ('+snap.docs.length+' docs)'); render(); }, err=>{ __log('❌ Error leyendo teams: '+err.message,true); showError('Error leyendo equipos',err); });
  onSnapshot(collection(dbase,"matches"), snap=>{ matches={}; snap.docs.forEach(d=>matches[d.id]=d.data()); loaded.matches=true; __log('✅ matches cargado ('+snap.docs.length+' docs)'); render(); }, err=>{ __log('❌ Error leyendo matches: '+err.message,true); showError('Error leyendo partidos',err); });
  onSnapshot(collection(dbase,"leagues"), snap=>{ leagues={}; snap.docs.forEach(d=>leagues[d.id]=d.data()); loaded.leagues=true; __log('✅ leagues cargado ('+snap.docs.length+' docs)'); render(); }, err=>{ __log('❌ Error leyendo leagues: '+err.message,true); showError('Error leyendo competiciones',err); });
});
function allLoaded(){ return Object.values(loaded).every(Boolean); }

function roundRobin(teamIds){
  let list=teamIds.slice();
  if(list.length%2!==0) list.push(null);
  const n=list.length, rounds=[];
  for(let r=0;r<n-1;r++){
    const rm=[];
    for(let i=0;i<n/2;i++){ const a=list[i], b=list[n-1-i]; if(a&&b) rm.push({a,b}); }
    rounds.push({matches:rm});
    list.splice(1,0,list.pop());
  }
  return rounds;
}
function pairKey(a,b){ return [a,b].sort().join('|'); }
function generarParejasSinRepetir(playerIds, usedPairs){
  const maxAttempts=500;
  for(let attempt=0; attempt<maxAttempts; attempt++){
    let ids=playerIds.slice();
    for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
    let byeId=null;
    if(ids.length%2!==0){ byeId=ids.pop(); }
    let pool=ids.slice(), pairs=[], ok=true;
    while(pool.length>0){
      const a=pool.shift();
      const idx=pool.findIndex(b=>!usedPairs.has(pairKey(a,b)));
      if(idx===-1){ ok=false; break; }
      const b=pool.splice(idx,1)[0];
      pairs.push([a,b]);
    }
    if(ok) return {pairs, byeId};
  }
  return null;
}

// ---- Helpers ----
function teamsOfLeague(lid){ return Object.entries(teams).filter(([id,t])=>t.leagueId===lid); }
function matchesOfLeague(lid){ return Object.entries(matches).filter(([id,m])=>m.leagueId===lid); }
function myTeamIdIn(lid){ const f=teamsOfLeague(lid).find(([id,t])=>t.players.includes(myId)); return f?f[0]:null; }
function myTeamIdInRound(lid, round){ const f=teamsOfLeague(lid).find(([id,t])=>t.round===round && t.players.includes(myId)); return f?f[0]:null; }
function teamName(id){ return id && teams[id] ? teams[id].name : '—'; }
function teamAvatar(id){ const t=id&&teams[id]; return (t&&t.photo) ? `<img class="avatar" src="${t.photo}">` : ''; }
function standingsFor(lid){
  const rows = teamsOfLeague(lid).map(([id,t])=>{
    const played = matchesOfLeague(lid).map(([,m])=>m).filter(m=>m.played&&(m.teamA===id||m.teamB===id));
    const wins = played.filter(m=>m.result.winner===id).length;
    let sf=0, sc=0;
    played.forEach(m=>{
      if(m.teamA===id){ sf+=m.result.setsA; sc+=m.result.setsB; } else { sf+=m.result.setsB; sc+=m.result.setsA; }
    });
    return {id, name:t.name, pj:played.length, pg:wins, pp:played.length-wins, sf, sc, dif:sf-sc};
  });
  rows.sort((a,b)=> b.pg-a.pg || b.dif-a.dif || b.sf-a.sf);
  return rows;
}
function standingsPlayers(lid){
  const stats={};
  matchesOfLeague(lid).forEach(([,m])=>{
    if(!m.played) return;
    const ta=teams[m.teamA]?.players||[], tb=teams[m.teamB]?.players||[];
    ta.forEach(pid=>{
      stats[pid]=stats[pid]||{pj:0,pg:0,pp:0,sf:0,sc:0};
      stats[pid].pj++; stats[pid].sf+=m.result.setsA; stats[pid].sc+=m.result.setsB;
      if(m.result.winner===m.teamA) stats[pid].pg++; else stats[pid].pp++;
    });
    tb.forEach(pid=>{
      stats[pid]=stats[pid]||{pj:0,pg:0,pp:0,sf:0,sc:0};
      stats[pid].pj++; stats[pid].sf+=m.result.setsB; stats[pid].sc+=m.result.setsA;
      if(m.result.winner===m.teamB) stats[pid].pg++; else stats[pid].pp++;
    });
  });
  const rows=Object.entries(stats).map(([pid,s])=>({id:pid, name: players[pid]?players[pid].name:'Jugador Desconocido', ...s, dif:s.sf-s.sc}));
  rows.sort((a,b)=> b.pg-a.pg || b.dif-a.dif || b.sf-a.sf);
  return rows;
}

// ---- Login ----
async function entrarConNombre(name){
  name=(name||'').trim(); if(!name) return;
  const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  if(!slug){ alert('Pon un nombre válido'); return; }
  myId=slug;
  localStorage.setItem('padel_myid', slug);
  localStorage.setItem('padel_myname', name);
  try{ await setDoc(doc(dbase,"players/"+slug), {name}, {merge:true}); }
  catch(err){ showError('No se pudo entrar',err); }
  render();
}
function cerrarSesion(){
  localStorage.removeItem('padel_myid'); localStorage.removeItem('padel_myname');
  myId=null; isAdmin=false; render();
}

// ---- Fotos de equipo ----
function resizeImageFile(file, maxSize){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } }
        else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.7));
      };
      img.onerror=()=>reject(new Error('Imagen no válida'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}
async function subirFotoEquipo(teamId, inputEl){
  const file = inputEl.files && inputEl.files[0]; if(!file) return;
  try{
    const dataUrl = await resizeImageFile(file, 160);
    if(dataUrl.length > 700000){ alert('La foto pesa demasiado incluso reducida, prueba con otra.'); return; }
    await updateDoc(doc(dbase,"teams/"+teamId), {photo:dataUrl});
  }catch(err){ showError('No se pudo subir la foto',err); }
}
function teamPhotoEditor(teamId){
  const t=teams[teamId];
  const img = (t&&t.photo) ? `<img class="avatarBig" src="${t.photo}">` : '';
  return `<div class="row" style="align-items:center;margin-bottom:10px">${img}<label class="small secondary" style="cursor:pointer;padding:6px 10px;border:1px solid var(--border);border-radius:8px">
    📷 ${t&&t.photo?'Cambiar foto del equipo':'Añadir foto del equipo'}
    <input type="file" accept="image/*" style="display:none" onchange="subirFotoEquipo('${teamId}', this)">
  </label></div>`;
}

// ---- Competiciones ----
async function crearCompeticion(modo, name, format){
  if(!isAdmin) return;
  format = format==='random' ? 'random' : 'fijo';
  name=(name||'').trim();
  if(!name) name=(modo==='liga'?'Liga ':'Torneo ')+(Object.values(leagues).filter(l=>l.mode===modo).length+1);
  const lid=(modo==='liga'?'lg_':'tn_')+Math.random().toString(36).slice(2,9);
  selectedLeagueId[modo]=lid;
  localStorage.setItem('padel_sel_'+modo, lid);
  try{
    await setDoc(doc(dbase,"leagues/"+lid), {name, mode:modo, format, phase:'registration', currentRound:0, totalRounds:0, schedule:null, participants:[], createdAt:Date.now()});
  }catch(err){ showError('No se pudo crear',err); }
}
async function crearEquipo(lid, name){
  if(!name.trim()||!lid) return;
  try{
    const teamId="t_"+Math.random().toString(36).slice(2,9);
    await setDoc(doc(dbase,"teams/"+teamId), {name:name.trim(), players:[myId], leagueId:lid});
  }catch(err){ showError('No se pudo crear el equipo',err); }
}
async function unirseEquipo(teamId){
  const t=teams[teamId]; if(!t||t.players.length>=2) return;
  try{ await updateDoc(doc(dbase,"teams/"+teamId), {players:[...t.players, myId]}); }
  catch(err){ showError('No se pudo unir al equipo',err); }
}
async function salirDeEquipo(teamId){
  const t=teams[teamId]; if(!t) return;
  if(!confirm('¿Salir del equipo "'+t.name+'"? Podrás crear uno nuevo o unirte a otro.')) return;
  try{
    const rest=t.players.filter(p=>p!==myId);
    if(rest.length===0){ await deleteDoc(doc(dbase,"teams/"+teamId)); }
    else{ await updateDoc(doc(dbase,"teams/"+teamId), {players:rest}); }
  }catch(err){ showError('No se pudo salir del equipo',err); }
}
async function renombrarEquipo(teamId, newName){
  if(!isAdmin) return;
  newName=(newName||'').trim(); if(!newName) return;
  try{ await updateDoc(doc(dbase,"teams/"+teamId), {name:newName}); }
  catch(err){ showError('No se pudo renombrar el equipo',err); }

async function quitarJugadorDeEquipo(teamId, playerId){

// ---- Liga/torneo de parejas rotativas (random) ----
async function apuntarseLigaRandom(lid){
  if(!myId) return;
  try{ await updateDoc(doc(dbase,"leagues/"+lid), {participants: arrayUnion(myId)}); }
  catch(err){ showError('No se pudo apuntar',err); }
}
async function salirLigaRandom(lid){
  if(!myId) return;
  try{ await updateDoc(doc(dbase,"leagues/"+lid), {participants: arrayRemove(myId)}); }
  catch(err){ showError('No se pudo quitar de la lista',err); }
}
async function quitarParticipante(lid, pid){
  if(!isAdmin) return;
  try{ await updateDoc(doc(dbase,"leagues/"+lid), {participants: arrayRemove(pid)}); }
  catch(err){ showError('No se pudo quitar al participante',err); }
}
async function lanzarLigaRandom(lid){
  const lg=leagues[lid]; if(!isAdmin||!lg) return;
  const participants=lg.participants||[];
  if(participants.length<4){ alert('Hacen falta al menos 4 jugadores apuntados.'); return; }
  const numRondas=parseInt(prompt('¿Cuántas jornadas quieres generar? (sin repetir pareja de compañero)', String(participants.length-1))||'0');
  if(!numRondas||numRondas<1) return;
  const usedPairs=new Set();
  const schedule=[];
  for(let r=0;r<numRondas;r++){
    const result=generarParejasSinRepetir(participants, usedPairs);
    if(!result) break;
    result.pairs.forEach(([a,b])=>usedPairs.add(pairKey(a,b)));
    let pool=result.pairs.slice();
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    const roundMatches=[];
    while(pool.length>=2){ const pa=pool.shift(), pb=pool.shift(); roundMatches.push({a:pa,b:pb}); }
    let bye = result.byeId ? [result.byeId] : [];
    if(pool.length===1) bye = bye.concat(pool[0]);
    schedule.push({matches:roundMatches, bye});
  }
  if(schedule.length===0){ alert('No se ha podido generar ninguna jornada sin repetir pareja con estos jugadores.'); return; }
  try{
    await updateDoc(doc(dbase,"leagues/"+lid), {phase:'active', currentRound:0, totalRounds:schedule.length, schedule});
    await crearPartidosRondaRandom(lid, schedule, 0);
    if(schedule.length<numRondas) alert('Se han generado '+schedule.length+' jornadas (menos de las '+numRondas+' pedidas): con estos jugadores no se pueden formar más sin repetir compañero.');
  }catch(err){ showError('No se pudo lanzar',err); }
}
async function crearPartidosRondaRandom(lid, schedule, roundIdx){
  if(roundIdx>=schedule.length) return;
  const rd=schedule[roundIdx];
  const teamIdFor = (pair)=> `${lid}_r${roundIdx}_t_${pair.slice().sort().join('_')}`;
  try{
    const allPairs=[]; rd.matches.forEach(m=>{ allPairs.push(m.a); allPairs.push(m.b); });
    await Promise.all(allPairs.map(pair=>{
      const tid=teamIdFor(pair);
      const nm=pair.map(pid=>players[pid]?players[pid].name:'Jugador').join(' & ');
      return setDoc(doc(dbase,"teams/"+tid), {name:nm, players:pair, leagueId:lid, round:roundIdx, ephemeral:true});
    }));
    await Promise.all(rd.matches.map(m=>{
      const ta=teamIdFor(m.a), tb=teamIdFor(m.b);
      return setDoc(doc(dbase,`matches/${lid}_r${roundIdx}_${ta}_vs_${tb}`), {leagueId:lid, round:roundIdx, teamA:ta, teamB:tb, proposal:null, votes:{}, confirmed:false, played:false, result:null});
    }));
  }catch(err){ showError('No se pudieron crear los partidos de la jornada',err); }
}

async function lanzarCompeticion(lid){
  const lg=leagues[lid]; if(!isAdmin||!lg) return;
  if(lg.format==='random'){ return lanzarLigaRandom(lid); }
  const ids=teamsOfLeague(lid).map(([id])=>id);
  if(ids.length<2) return;
  const schedule=roundRobin(ids);
  try{
    await updateDoc(doc(dbase,"leagues/"+lid), {phase:'active', currentRound:0, totalRounds:schedule.length, schedule});
    await crearPartidosRonda(lid, schedule, 0);
  }catch(err){ showError('No se pudo lanzar',err); }
}
async function crearPartidosRonda(lid, schedule, roundIdx){
  if(roundIdx>=schedule.length) return;
  try{
    await Promise.all(schedule[roundIdx].matches.map(({a,b})=>
      setDoc(doc(dbase,`matches/${lid}_r${roundIdx}_${a}_${b}`), {leagueId:lid, round:roundIdx, teamA:a, teamB:b, proposal:null, votes:{}, confirmed:false, played:false, result:null})
    ));
  }catch(err){ showError('No se pudieron crear los partidos de la ronda',err); }
}
async function agregarPartidoManual(lid, teamAId, teamBId){
  const lg=lid?leagues[lid]:null;
  if(!isAdmin||!lid||!lg) return;
  if(!teamAId||!teamBId||teamAId===teamBId){ alert('Elige dos equipos distintos'); return; }
  try{
    await setDoc(doc(dbase,`matches/${lid}_r${lg.currentRound}_${teamAId}_${teamBId}`), {leagueId:lid, round:lg.currentRound, teamA:teamAId, teamB:teamBId, proposal:null, votes:{}, confirmed:false, played:false, result:null});
  }catch(err){ showError('No se pudo añadir el partido',err); }
}
async function eliminarPartido(matchId){
  if(!isAdmin) return;
  if(!confirm('¿Eliminar este partido de la ronda?')) return;
  try{ await deleteDoc(doc(dbase,"matches/"+matchId)); }catch(err){ showError('No se pudo eliminar el partido',err); }
}
async function proponerFecha(matchId, date, time){
  if(!date||!time) return;
  try{ await updateDoc(doc(dbase,"matches/"+matchId), {proposal:{date,time}, votes:{[myId]:true}, confirmed:false}); }
  catch(err){ showError('No se pudo proponer la fecha',err); }
}
async function votarOk(matchId, m){
  try{
    const votes={...m.votes,[myId]:true};
    const pids=[...teams[m.teamA].players, ...teams[m.teamB].players];
    const confirmed = pids.every(p=>votes[p]);
    await updateDoc(doc(dbase,"matches/"+matchId), {votes, confirmed});
  }catch(err){ showError('No se pudo votar',err); }
}
async function guardarResultado(matchId, m, sA, sB){
  sA=parseInt(sA); sB=parseInt(sB);
  if(isNaN(sA)||isNaN(sB)||sA===sB) return;
  const winner = sA>sB? m.teamA : m.teamB;
  try{
    await updateDoc(doc(dbase,"matches/"+matchId), {played:true, result:{setsA:sA, setsB:sB, winner}});
    await checkRondaCompleta(m.leagueId);
  }catch(err){ showError('No se pudo guardar el resultado',err); }
}
async function reiniciarPartido(matchId){
  if(!isAdmin) return;
  if(!confirm('¿Reiniciar este partido? Se borra la fecha propuesta, los votos y el resultado.')) return;
  try{ await updateDoc(doc(dbase,"matches/"+matchId), {proposal:null, votes:{}, confirmed:false, played:false, result:null}); }
  catch(err){ showError('No se pudo reiniciar el partido',err); }
}
async function checkRondaCompleta(lid){
  const lg=leagues[lid]; if(!lg) return;
  const cur=lg.currentRound;
  const roundMatches=matchesOfLeague(lid).map(([,m])=>m).filter(m=>m.round===cur);
  const total=(lg.schedule||[])[cur]?.matches.length||0;
  if(roundMatches.length>=total && roundMatches.every(m=>m.played)){
    const next=cur+1;
    try{
      if(next<lg.totalRounds){
        await updateDoc(doc(dbase,"leagues/"+lid), {currentRound:next});
        if(lg.format==='random'){ await crearPartidosRondaRandom(lid, lg.schedule, next); }
        else { await crearPartidosRonda(lid, lg.schedule, next); }
      } else {
        await updateDoc(doc(dbase,"leagues/"+lid), {phase:'finished'});
      }
    }catch(err){ showError('No se pudo avanzar de ronda',err); }
  }
}
async function retrocederRonda(lid){
  const lg=leagues[lid]; if(!isAdmin||!lg) return;
  if(lg.phase==='registration'){ alert('Todavía no ha empezado.'); return; }
  if(lg.phase==='finished'){
    if(!confirm('¿Reabrir la última ronda para corregir un resultado?')) return;
    try{ await updateDoc(doc(dbase,"leagues/"+lid), {phase:'active'}); }
    catch(err){ showError('No se pudo reabrir la ronda',err); }
    return;
  }
  if(lg.currentRound<=0){ alert('Ya estás en la primera ronda.'); return; }
  if(!confirm('¿Retroceder a la ronda anterior? Se borrarán los partidos ya generados de la ronda '+(lg.currentRound+1)+'.')) return;
  try{
    const toDelete=matchesOfLeague(lid).filter(([,m])=>m.round===lg.currentRound).map(([id])=>id);
    await Promise.all(toDelete.map(id=>deleteDoc(doc(dbase,"matches/"+id))));
    await updateDoc(doc(dbase,"leagues/"+lid), {currentRound: lg.currentRound-1});
  }catch(err){ showError('No se pudo retroceder de ronda',err); }
}
async function eliminarCompeticion(modo, lid){
  if(!isAdmin||!lid) return;
  if(!confirm('¿Eliminar est'+(modo==='liga'?'a liga':'e torneo')+' (sus equipos y partidos)? El historial no se toca. No se puede deshacer.')) return;
  try{
    const tds=teamsOfLeague(lid).map(([id])=>id);
    const mds=matchesOfLeague(lid).map(([id])=>id);
    await Promise.all([
      ...tds.map(id=>deleteDoc(doc(dbase,"teams/"+id))),
      ...mds.map(id=>deleteDoc(doc(dbase,"matches/"+id)))
    ]);
    await deleteDoc(doc(dbase,"leagues/"+lid));
    if(selectedLeagueId[modo]===lid){ selectedLeagueId[modo]=null; localStorage.removeItem('padel_sel_'+modo); }
  }catch(err){ showError('No se pudo eliminar',err); }
}

function renderMisPartidos(){
  if(!myId) return `<div class="card muted">Pon tu nombre en la pestaña Liga o Torneo para ver tu historial personal.</div>`;
  const misEquipos=new Set(Object.entries(teams).filter(([id,t])=>t.players.includes(myId)).map(([id])=>id));
  const propios=Object.values(matches).filter(m=>m.played && (misEquipos.has(m.teamA)||misEquipos.has(m.teamB)));
  let g=0,p=0;
  const rows=propios.map(m=>{
    const ladoA=misEquipos.has(m.teamA);
    const miId=ladoA?m.teamA:m.teamB, rivalId=ladoA?m.teamB:m.teamA;
    const gane=m.result.winner===miId;
    if(gane) g++; else p++;
    const lg=leagues[m.leagueId];
    const marcador=ladoA?`${m.result.setsA}-${m.result.setsB}`:`${m.result.setsB}-${m.result.setsA}`;
    return {liga: lg?lg.name:'—', modo: lg?(lg.mode==='torneo'?'Torneo':'Liga'):'', rivalId, gane, marcador};
  });
  let h=`<div class="card"><h2 style="margin-top:0">Tu historial</h2><p style="font-size:16px;margin:0"><b style="color:var(--accent)">${g}</b> ganados · <b style="color:var(--danger)">${p}</b> perdidos</p><p class="muted" style="margin:4px 0 0">${rows.length} partidos jugados en total</p></div>`;
  if(rows.length===0){ h+='<div class="card muted">Todavía no has jugado ningún partido.</div>'; return h; }
  h += `<div class="card"><table><tr><th>Competición</th><th>Rival</th><th>Resultado</th><th></th></tr>`;
  rows.forEach(r=>{
    h += `<tr><td>${esc(r.liga)} <span class="badge">${r.modo}</span></td><td>${teamAvatar(r.rivalId)}${esc(teamName(r.rivalId))}</td><td>${r.marcador}</td><td><span class="badge ${r.gane?'ok':'warn'}">${r.gane?'Ganado':'Perdido'}</span></td></tr>`;
  });
  h += `</table></div>`;
  return h;
}

    const myTid = myTeamIdInRound(lid, lg.currentRound);
    html += `<h2>Clasificación individual</h2><div class="card"><table><tr><th>Jugador</th><th>PJ</th><th>G</th><th>P</th><th>Sets</th><th>Dif</th></tr>`;
    standingsPlayers(lid).forEach(r=>{ html += `<tr><td>${esc(r.name)}${r.id===myId?' <span class="badge ok">tú</span>':''}</td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pp}</td><td>${r.sf}-${r.sc}</td><td>${r.dif>0?'+':''}${r.dif}</td></tr>`; });
    html += `</table></div>`;
    html += `<h2>Jornada ${lg.currentRound+1} de ${lg.totalRounds}</h2>`;
    if(!myTid){
      const byeHere=(lg.schedule[lg.currentRound].bye||[]).includes(myId);
      if(byeHere) html += `<div class="card muted">Esta jornada descansas.</div>`;
    }
  } else {
    const myTid = myTeamIdIn(lid);
    if(!myTid){
      const open=teamsOfLeague(lid).filter(([id,t])=>t.players.length<2);
      html += `<p class="muted">Hola ${esc(me.name)}. Crea un equipo o únete a uno existente en "${esc(lg.name)}".</p>
      <div class="card">
        <h2 style="margin-top:0">Crear equipo</h2>
        <div class="row"><input type="text" id="teamInput_${modo}" placeholder="Nombre del equipo"></div>
        <div style="margin-top:8px"><button onclick="crearEquipo('${lid}', document.getElementById('teamInput_${modo}').value)">Crear</button></div>
      </div>
      <div class="card"><h2 style="margin-top:0">Unirse a un equipo</h2>`;
      if(open.length===0) html += `<p class="muted">No hay equipos con hueco libre.</p>`;
      open.forEach(([id,t])=>{
        html += `<div class="row" style="justify-content:space-between;margin-bottom:6px">
          <span>${teamAvatar(id)}${esc(t.name)} <span class="badge">${t.players.length}/2</span></span>
          <button class="small" onclick="unirseEquipo('${id}')">Unirme</button></div>`;
      });
      html += `</div>`;
      return html;
    }
    if(lg.phase==='registration'){
      html += `<div class="card">${teamPhotoEditor(myTid)}<p class="muted">Esperando a que el admin lance "${esc(lg.name)}". Tu equipo: <b>${esc(teamName(myTid))}</b></p>
        <button class="small secondary" onclick="salirDeEquipo('${myTid}')">Cambiar de equipo</button></div>`;
      return html;
    }
    html += `<div class="card">${teamPhotoEditor(myTid)}</div>`;
    html += `<h2>Clasificación</h2><div class="card"><table><tr><th>Equipo</th><th>PJ</th><th>G</th><th>P</th><th>Sets</th><th>Dif</th></tr>`;
    standingsFor(lid).forEach(r=>{ html += `<tr><td>${teamAvatar(r.id)}${esc(r.name)}${r.id===myTid?' <span class="badge ok">tú</span>':''}</td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pp}</td><td>${r.sf}-${r.sc}</td><td>${r.dif>0?'+':''}${r.dif}</td></tr>`; });
    html += `</table></div>`;
    html += `<h2>Ronda ${lg.currentRound+1} de ${lg.totalRounds}</h2>`;
  }

  const myTid = esRandom ? myTeamIdInRound(lid, lg.currentRound) : myTeamIdIn(lid);
  const roundMatches=matchesOfLeague(lid).filter(([id,m])=>m.round===lg.currentRound);
  if(roundMatches.length===0) html += `<div class="card muted">Generando partidos…</div>`;
  roundMatches.forEach(([id,m])=>{
    const mine = m.teamA===myTid || m.teamB===myTid;
    const esTorneo = modo==='torneo';
    html += `<div class="card match ${mine?'mine':''}">
      <div class="row" style="justify-content:space-between">
        <div><span class="vteam">${teamAvatar(m.teamA)}${esc(teamName(m.teamA))}</span><span class="vs">vs</span><span class="vteam">${teamAvatar(m.teamB)}${esc(teamName(m.teamB))}</span></div>
        ${m.played?'<span class="badge ok">Jugado</span>': esTorneo?'<span class="badge warn">Por jugar</span>': (m.confirmed?'<span class="badge ok">Fecha confirmada</span>': m.proposal?'<span class="badge warn">Pendiente de votos</span>':'<span class="badge">Sin fecha</span>')}
      </div>`;
    if(m.played){
      html += `<p class="muted">Resultado: ${m.result.setsA} - ${m.result.setsB} · Ganador: ${esc(teamName(m.result.winner))}</p>`;
    } else if(mine && esTorneo){
      html += `<div class="row" style="margin-top:8px">
        <input type="number" id="sa_${id}" placeholder="Sets ${esc(teamName(m.teamA))}" style="max-width:110px">
        <input type="number" id="sb_${id}" placeholder="Sets ${esc(teamName(m.teamB))}" style="max-width:110px">
        <button class="small" onclick="guardarResultado('${id}', ${JSON.stringify(m).replace(/"/g,'&quot;')}, document.getElementById('sa_${id}').value, document.getElementById('sb_${id}').value)">Guardar resultado</button>
      </div>`;
    } else if(mine && !esTorneo){
      if(!m.proposal){
        html += `<div class="row" style="margin-top:8px">
          <input type="date" id="d_${id}" style="max-width:150px">
          <input type="time" id="h_${id}" style="max-width:110px">
          <button class="small" onclick="proponerFecha('${id}', document.getElementById('d_${id}').value, document.getElementById('h_${id}').value)">Proponer fecha</button>
        </div>`;
      } else if(!m.confirmed){
        html += `<p>Propuesta: <b>${m.proposal.date} ${m.proposal.time}</b></p>
          <div class="row">
          ${m.votes[myId]? '<span class="badge ok">Ya votaste OK</span>' : '<button class="small" onclick="votarOk(\''+id+'\', '+JSON.stringify(m).replace(/"/g,'&quot;')+')">Votar OK</button>'}
          </div>
          <div style="margin-top:8px"><button class="small secondary" onclick="document.getElementById('rep_${id}').style.display='flex'">Proponer otra fecha</button>
          <div id="rep_${id}" class="row" style="display:none;margin-top:6px">
            <input type="date" id="d2_${id}" style="max-width:150px">
            <input type="time" id="h2_${id}" style="max-width:110px">
            <button class="small" onclick="proponerFecha('${id}', document.getElementById('d2_${id}').value, document.getElementById('h2_${id}').value)">Reproponer</button>
          </div></div>`;
      } else {
        html += `<p>Fecha: <b>${m.proposal.date} ${m.proposal.time}</b></p>
          <div class="row" style="margin-top:8px">
            <input type="number" id="sa_${id}" placeholder="Sets ${esc(teamName(m.teamA))}" style="max-width:110px">
            <input type="number" id="sb_${id}" placeholder="Sets ${esc(teamName(m.teamB))}" style="max-width:110px">
            <button class="small" onclick="guardarResultado('${id}', ${JSON.stringify(m).replace(/"/g,'&quot;')}, document.getElementById('sa_${id}').value, document.getElementById('sb_${id}').value)">Guardar resultado</button>
          </div>`;
      }
    } else if(!esTorneo && m.proposal){
      html += `<p class="muted">Fecha propuesta: ${m.proposal.date} ${m.proposal.time}</p>`;
    }
    if(isAdmin){
      html += `<div style="margin-top:8px"><button class="small secondary" style="border-color:var(--danger);color:var(--danger)" onclick="reiniciarPartido('${id}')">Reiniciar partido (admin)</button></div>`;
    }
    html += `</div>`;
  });

  if(lg.phase==='finished'){
    html += `<div class="card"><h2 style="margin-top:0">🏆 ${Label} terminad${modo==='liga'?'a':'o'}</h2><p class="muted">Consulta la clasificación final arriba, o crea un${modo==='liga'?'a nueva liga':' nuevo torneo'} desde el panel de admin.</p></div>`;
  }
  return html;
}

function render(){
  const app=document.getElementById('app');
  let html = '';
  if(myId) html += `<p class="muted" style="margin:14px 0 14px">Conectado como <b>${esc(localStorage.getItem('padel_myname')||myId)}</b> · <a href="#" onclick="cerrarSesion();return false;" style="color:var(--muted)">cambiar</a></p>`;
  if(lastError) html += `<div class="card" style="border-color:var(--danger);color:var(--danger)">⚠️ ${esc(lastError)}</div>`;
  renderAdminCorner();
  if(!allLoaded()){ html += '<div class="loading">Cargando… (mira el panel verde de abajo para ver en qué paso se queda)</div>'; app.innerHTML=html; return; }

  html += `<div class="row" style="margin-bottom:14px">
    <button class="tabbtn ${tab==='liga'?'on':''}" onclick="cambiarTab('liga')">Liga</button>
    <button class="tabbtn ${tab==='torneo'?'on':''}" onclick="cambiarTab('torneo')">Torneo</button>
    <button class="tabbtn ${tab==='mios'?'on':''}" onclick="cambiarTab('mios')">Mis partidos</button>
    <button class="tabbtn ${tab==='historial'?'on':''}" onclick="cambiarTab('historial')">Historial</button>
  </div>`;

  if(tab==='historial') html += renderHistorial();
  else if(tab==='mios') html += renderMisPartidos();
  else html += renderCompeticion(tab);
  app.innerHTML=html;
}

window.entrarConNombre=entrarConNombre; window.cerrarSesion=cerrarSesion; window.crearEquipo=crearEquipo; window.unirseEquipo=unirseEquipo;
window.adminLogin=adminLogin; window.lanzarCompeticion=lanzarCompeticion; window.proponerFecha=proponerFecha;
window.votarOk=votarOk; window.guardarResultado=guardarResultado; window.crearCompeticion=crearCompeticion;
window.eliminarCompeticion=eliminarCompeticion; window.eliminarEquipo=eliminarEquipo; window.reiniciarPartido=reiniciarPartido;
window.retrocederRonda=retrocederRonda; window.cambiarTab=cambiarTab; window.toggleHistorial=toggleHistorial; window.toggleDebug=toggleDebug;
window.salirAdmin=salirAdmin; window.subirFotoEquipo=subirFotoEquipo; window.agregarPartidoManual=agregarPartidoManual; window.eliminarPartido=eliminarPartido;
window.renombrarJugador=renombrarJugador; window.eliminarJugador=eliminarJugador;
window.salirDeEquipo=salirDeEquipo; window.renombrarEquipo=renombrarEquipo; window.quitarJugadorDeEquipo=quitarJugadorDeEquipo;
window.pickLeague=pickLeague; window.apuntarseLigaRandom=apuntarseLigaRandom; window.salirLigaRandom=salirLigaRandom;
window.quitarParticipante=quitarParticipante;
</script>
